<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samara</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22elm%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2314532d%22%2F%3E%3Cpath%20d%3D%22M20%2046%20C%2013%2033%2C%2022%2015%2C%2049%2013%20C%2051%2033%2C%2039%2049%2C%2020%2046%20Z%22%20fill%3D%22%2386efac%22%2F%3E%3Cpath%20d%3D%22M20%2046%20L%2046%2017%22%20stroke%3D%22%2314532d%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M26%2039%20L%2020%2033%20M26%2039%20L%2034%2041%20M32%2032%20L%2027%2024%20M32%2032%20L%2041%2034%20M38%2025%20L%2035%2018%20M38%2025%20L%2045%2026%22%20stroke%3D%22%2314532d%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M20%2046%20L%2013%2053%22%20stroke%3D%22%2386efac%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #15803d; --accent-ink: #ffffff; --warn-bg: #fff4e0; --warn-ink: #7a4b00; --err: #b3261e;
    --code: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecece8; --muted: #9c9c96; --line: #34342f;
      --accent: #86efac; --accent-ink: #0d0d0c; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err: #ff8a80;
      --code: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* or a display rule (button.icon) shows it anyway */
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 120px; }
  header { text-align: center; margin: 8vh 0 24px; transition: margin .2s; }
  body.has-results header { margin: 0 0 16px; text-align: left; }
  h1 { font-size: 2rem; margin: 0; letter-spacing: -.02em; }
  h1 a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: .35em; }
  h1 .mark { width: 1em; height: 1em; flex: none; }   /* the favicon, so the tab and page match */
  body.has-results h1 { font-size: 1.2rem; }
  header p { color: var(--muted); margin: 4px 0 0; }
  body.has-results header p { display: none; }
  /* Start over: only once there is a conversation to clear. */
  body.has-results header { display: flex; align-items: baseline; gap: 16px; }   /* Start over beside the title */
  #restart { color: var(--muted); font-size: .85rem; }
  body:not(.has-results) #restart { display: none; }
  /* Read by screen readers, not shown: "Answer ready", "Stopped", errors. */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  form { display: flex; gap: 8px; }
  #q { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 12px 16px;
       border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 0 20px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  #go { min-width: 110px; }   /* wide enough to read as a button, not an icon */
  #go.stop { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  /* The top step, Ultrathink, in rainbow: a nod to Claude Code, where typing
     ultrathink asks for the most thinking and lights up the same way. Brighter
     colours in dark mode, a shimmer only on hover, none for reduced motion, and
     plain text in Windows high-contrast mode, where gradient text can vanish. */
  button.secondary.rainbow { background-image: linear-gradient(90deg, #d63031, #e67e22, #16a085, #2980b9, #8e44ad, #d63031);
                   background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
                   color: transparent; font-weight: 600; }
  button.secondary.rainbow:hover { animation: shimmer 2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-color-scheme: dark) {
    button.secondary.rainbow { background-image: linear-gradient(90deg, #ff7675, #fdcb6e, #55efc4, #74b9ff, #a29bfe, #ff7675); }
  }
  @media (prefers-reduced-motion: reduce) { button.secondary.rainbow:hover { animation: none; } }
  @media (forced-colors: active) { button.secondary.rainbow { background: none; color: ButtonText; } }
  /* Quiet actions read as links (Dig deeper, Try again); Think harder stays a button. */
  button.link { background: none; border: 0; padding: 4px 6px; border-radius: 4px; color: var(--muted);
                text-decoration: underline; font-size: .85rem; }
  button.link.md-toggle { display: inline-flex; align-items: center; text-decoration: none; }
  button.link.md-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
                              stroke-linecap: round; stroke-linejoin: round; }
  button.link.md-toggle[aria-pressed="true"] { color: var(--ink); background: var(--code); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 12px; font-size: .85rem; }

  /* Two, side by side: the questions people ask most (one fill-in-the-blank,
     one list), and ones that answer reliably. */
  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px auto 0; max-width: 620px; }
  body.has-results .examples { display: none; }
  .examples button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
                     padding: 10px 14px; font-size: .9rem; text-align: center; }
  @media (max-width: 520px) { .examples { grid-template-columns: 1fr; } }

  #banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
  #banner code { background: transparent; }

  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 16px; }
  .turn .question { font-weight: 600; font-size: 1.05rem; margin-bottom: 8px; display: flex; gap: 12px; justify-content: space-between; align-items: start; }
  .turn .question .actions { flex: none; display: flex; gap: 8px; }
  button.icon { display: inline-flex; align-items: center; gap: 6px; }
  button.icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6;
                    stroke-linecap: round; stroke-linejoin: round; }
  .markdown-view { margin-top: 12px; }
  .markdown-view textarea { width: 100%; height: 320px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--code); color: var(--ink); resize: vertical; }
  .markdown-view .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .status { color: var(--muted); font-size: .9rem; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--err); }
  .answer p { margin: .5em 0; }
  .answer h1, .answer h2, .answer h3 { font-size: 1rem; margin: 1em 0 .3em; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }

  /* The card's last row: take-away (Copy, CSV, </> for the Markdown) on the left, the
     buttons that ask again (Dig deeper, Think harder) on the right. */
  .turn-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .turn-foot .exports, .turn-foot .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .turn-foot .buttons { margin-left: auto; }
  .part.detail { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; }
  /* An answer replaced by Think harder folds to its question until asked for. */
  .turn.earlier:not(.open) > :not(.question) { display: none; }
  .turn.earlier .question { margin-bottom: 0; color: var(--muted); }
  .turn.earlier.open .question { margin-bottom: 8px; }
  .retry-note { color: var(--muted); font-size: .85rem; font-style: italic; margin: -2px 0 8px; }
  details.steps { font-size: .85rem; color: var(--muted); margin-top: 12px; }
  details.steps .worked { color: var(--ink); opacity: .85; }
  details.steps .worked :first-child { margin-top: 6px; }
  details.steps .queries-label { margin: 10px 0 0; font-weight: 600; }
  details.steps summary { cursor: pointer; }
  details.steps .queries-head { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  details.steps .queries-head span { font-weight: 600; }
  /* Notes are drawn by CSS, which browsers never copy, so selecting the script by
     hand gets only the commands (user-select: none was not enough in Safari). */
  pre.script .ln[data-note]::after { content: attr(data-note); color: var(--muted); }
  details.steps .queries-head small { font-weight: 400; }
  pre.script { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--code); color: var(--ink);
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: pre; }
  details.steps code { color: var(--ink); }

  .table-block { margin: 14px 0; }
  .table-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .table-head strong { font-size: .95rem; }
  .table-scroll { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  /* Long cells wrap rather than run off the right edge, where macOS hides the
     scrollbar; headings stay on one line. */
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { white-space: nowrap; }
  td { white-space: nowrap; }
  td.long { white-space: normal; overflow-wrap: anywhere; min-width: 16ch; }   /* only long cells wrap */
  th { position: sticky; top: 0; background: var(--panel); cursor: pointer; user-select: none; }
  tr:last-child td { border-bottom: 0; }
  .note { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  th[aria-sort="ascending"]::after { content: " \25B2"; font-size: .7em; }
  th[aria-sort="descending"]::after { content: " \25BC"; font-size: .7em; }
  @media (max-width: 520px) {   /* phones: less padding, a smaller Ask button */
    main { padding-top: 16px; }
    #go { min-width: 72px; padding: 0 14px; }
    .turn { padding: 14px; }
    h1 { font-size: 1.6rem; }
  }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 32px; }
  /* The caution is the line that matters; the setup details sit quietly under it. */
  footer .caution { display: block; font-style: italic; color: var(--ink); opacity: .75;
                    font-size: .85rem; margin-bottom: 14px; }
  footer .setup { display: block; opacity: .7; }
  footer button { background: none; border: 0; padding: 0; font: inherit; color: inherit;
                  text-decoration: underline; cursor: pointer; }
  footer a { color: inherit; }
  #commands { margin: 8px auto 0; max-width: 700px; color: var(--muted); font-size: .8rem;
              text-align: center; line-height: 1.7; }
  #commands code { font-size: .95em; }
  #credit { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 6px; opacity: .7; }
  #credit a { color: inherit; }

  /* Browser printing stays sensible even though there is no print button. */
  @media print {
    body { background: #fff; color: #000; }
    main { max-width: none; padding: 0; }
    header, form, .examples, #banner, footer, button { display: none !important; }
    .markdown-view { display: none; }
    .turn { border: 0; padding: 0; margin: 0; }
    .turn .question { display: block; font-size: 1.1rem; }
    .table-scroll { max-height: none; overflow: visible; }
    table { font-size: .8rem; }
    thead { display: table-header-group; }          /* repeat headings across pages */
    tr, .table-block, details.steps { break-inside: avoid; }
    details.steps { color: #333; }
    details.steps summary { font-weight: 600; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="/"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14532d"/><path d="M20 46 C 13 33, 22 15, 49 13 C 51 33, 39 49, 20 46 Z" fill="#86efac"/><path d="M20 46 L 46 17" stroke="#14532d" stroke-width="2.4" stroke-linecap="round"/><path d="M26 39 L 20 33 M26 39 L 34 41 M32 32 L 27 24 M32 32 L 41 34 M38 25 L 35 18 M38 25 L 45 26" stroke="#14532d" stroke-width="1.8" stroke-linecap="round"/><path d="M20 46 L 13 53" stroke="#86efac" stroke-width="4" stroke-linecap="round"/></svg>Samara</a></h1>
    <p id="subtitle">Ask about your LogicMonitor portal in plain English. Read-only.</p>
    <a id="restart" href="/" title="Clear this conversation and start again">Start over</a>
  </header>
  <div id="announce" class="sr-only" aria-live="polite"></div>

  <form id="form">
    <input id="q" autocomplete="off" placeholder="e.g. what alerts started in the last hour?" autofocus>
    <button id="go" type="submit">Ask</button>
  </form>

  <div class="examples">
    <button type="button">Is DEVICE okay?</button>
    <button type="button">Which devices are down?</button>
  </div>

  <div id="banner" hidden></div>
  <div id="results"></div>
  <footer id="footer"></footer>
  <div id="commands" hidden></div>
  <p id="credit">Powered by <a href="https://rdmarsh.github.io/elm/" target="_blank" rel="noopener">elm</a><span id="elm-version"></span></p>
</main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);

// Small inline icons: no network, and they follow the text colour.
const ICON = {
  csv: `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="14" height="12" rx="2"/><path d="M1 6h14M6 6v8"/></svg>`,
  source: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4M9 2.5 7 13.5"/></svg>`,
  md: `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="3" width="14" height="10" rx="2"/><path d="M4 11V6l2 2.5L8 6v5M11 6v3.5M11 10l1.5-1.5M11 10 9.5 8.5"/></svg>`,
};
const form = $("#form"), input = $("#q"), go = $("#go"), results = $("#results");
let conversationId = null;

// An example naming DEVICE is a fill-in-the-blank: put it in the box, select the
// word to replace, and let the person type the name rather than guessing one.
document.querySelectorAll(".examples button").forEach(b =>
  b.addEventListener("click", () => {
    input.value = b.textContent;
    const blank = input.value.indexOf("DEVICE");
    if (blank < 0) { form.requestSubmit(); return; }
    input.focus();
    input.setSelectionRange(blank, blank + "DEVICE".length);
  }));

fetch("/api/health").then(r => r.json()).then(h => {
  health = h;
  const problems = [];
  if (h.model_problem) problems.push(esc(h.model_problem));
  if (h.needs_claude && !h.claude_key) problems.push("No Claude API key is set. Start the container with <code>-e ANTHROPIC_API_KEY=...</code>.");
  if (h.profile_problem) problems.push(esc(h.profile_problem));
  if (problems.length) { $("#banner").innerHTML = problems.join("<br>"); $("#banner").hidden = false; }
  if (h.elm_version) $("#elm-version").textContent = ` v${h.elm_version}`;
  const scope = h.restricted ? `${h.allowed.length} allowed elm commands` : "all elm commands";
  if (h.portal) $("#subtitle").textContent = `Ask about ${h.portal} in plain English. Read-only.`;
  const portal = h.portal
    ? `Portal: <a href="https://${esc(h.portal)}.logicmonitor.com" target="_blank" rel="noopener">${esc(h.portal)}</a> · `
    : "";
  $("#footer").innerHTML = `<span class="caution">Answers can be wrong — check "How I worked this out".</span>`
    + `<span class="setup">${portal}Profile: ${esc(h.profile)} `
    + `(<button id="show-commands" type="button">${scope}</button>)</span>`
    + `<span class="setup">Default model: ${esc(h.model)}${h.model_id ? ` (${esc(h.model_id)})` : ""}${h.effort ? `, effort ${esc(h.effort)}` : ""}`
    + `${h.off ? `, sends questions and portal data to ${esc(h.off)}` : ", on this machine"}</span>`;
  $("#show-commands").addEventListener("click", () => {
    const panel = $("#commands");
    panel.hidden = !panel.hidden;
    panel.innerHTML = panel.hidden ? "" :
      `These are the commands this profile allows (<code>allowed_commands</code> in its .ini); `
      + `anything else is refused before a request is sent.<br>`
      + h.allowed.map(c => `<code>${esc(c)}</code>`).join(" ");
  });
}).catch(() => {});

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Small Markdown subset: headings, bullets, numbered lists, bold, italic, code.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)_([^_]+)_(?=\W|$)/g, "$1<em>$2</em>");
}
function markdown(text) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const lines = text.split("\n"), isRow = l => /^\s*\|.*\|\s*$/.test(l);
  const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (isRow(line)) {   // a Markdown table: take all its lines, drop the |---| separator
      close();
      const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(lines[i++]);
      i--;
      const body = rows.filter(r => !/^[\s|:-]+$/.test(r));
      // A header with no rows is the model echoing a table show_table already
      // put on the page (seen with Haiku): show nothing rather than bare pipes.
      if (body.length > 1) out.push(`<div class="table-scroll"><table><thead><tr>${
        cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")
        }</tbody></table></div>`);
    }
    else if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1])}</h3>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (!line.trim()) { close(); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join("");
}

function saveFile(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function csvCell(v) {
  const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function renderTable(ev) {
  const block = document.createElement("div");
  block.className = "table-block";
  block.innerHTML = `
    <div class="table-head"><strong>${esc(ev.title)}</strong></div>
    <div class="table-scroll"><table><thead><tr>${ev.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="note">${ev.total} row${ev.total === 1 ? "" : "s"}${ev.total > ev.rows.length ? ` (showing first ${ev.rows.length})` : ""} · click a heading to sort</div>`;
  const tbody = $("tbody", block);
  const draw = rows => tbody.innerHTML = rows.map(r =>
    `<tr>${r.map(v => { const text = v && typeof v === "object" ? JSON.stringify(v) : String(v ?? "");
      return `<td${text.length > 24 ? ' class="long"' : ""}>${esc(text)}</td>`; }).join("")}</tr>`).join("");
  let rows = ev.rows.slice(), sortCol = -1, dir = 1;
  draw(rows);
  block.querySelectorAll("th").forEach((th, i) => th.addEventListener("click", () => {
    dir = sortCol === i ? -dir : 1; sortCol = i;
    block.querySelectorAll("th").forEach(h => h.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending");
    rows.sort((a, b) => {
      const x = a[i], y = b[i];
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x ?? "").localeCompare(String(y ?? ""), undefined, { numeric: true }) * dir;
    });
    draw(rows);
  }));
  return block;
}

// Everything an answer is made of, kept so it can be rebuilt as Markdown.
let health = null;

const slug = s => s.replace(/[^\w-]+/g, "_").replace(/^_|_$/g, "").slice(0, 60) || "elm-ask";

function tableMarkdown(t) {
  const cell = v => String(v ?? "").replace(/\|/g, "\\|");
  return [`**${t.title}**`, "",
    `| ${t.columns.join(" | ")} |`,
    `| ${t.columns.map(() => "---").join(" | ")} |`,
    ...t.rows.map(r => `| ${r.map(cell).join(" | ")} |`),
    t.total > t.rows.length ? `\n(${t.total} rows, first ${t.rows.length} shown)` : ""].join("\n");
}

// ISO date order and a 24-hour clock, with the zone, e.g. 2026-10-26 22:26:04 AEDT:
// unambiguous like ISO 8601, easier to read than 2026-10-26T22:26:04+11:00.
function isoNow() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const zone = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
    .formatToParts(d).find(x => x.type === "timeZoneName")?.value || "";
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
    + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ${zone}`.trim();
}

function answerMarkdown(a) {
  const when = health ? ` · ${health.profile} · ${a.model || health.model}${health.effort ? ` · ${health.effort} effort` : ""}` : "";
  // elm's version too: an answer can change with elm (a filter fix, a refused field)
  // the portal, so answers from two machines can be told apart; the build, so a
  // pasted answer says which code gave it (elm's version stays put between releases)
  const cost = (a.costText ? ` · ${a.costText}` : "") + (health && health.portal ? ` · ${health.portal}` : "")
    + (health && health.elm_version ? ` · elm ${health.elm_version}` : "")
    + (health && health.build ? ` · build ${health.build}` : "");
  const [main, worked] = splitWorked(a.answer);
  return [`# ${a.question}`, "",   // the same order as the page: the answer, its tables, how it was worked out
    main.trim(), "",
    ...a.tables.map(tableMarkdown),
    a.tables.length ? "" : null,
    ...(worked.trim() ? ["**How I worked this out**", "", worked.trim(), ""] : []),
    ...(a.detail ? ["## Dig deeper", "", a.detail, ""] : []),
    `_Samara${when}${cost} · ${isoNow()}_`,
  ].filter(x => x !== null).join("\n");
}

let current = null;   // the AbortController of the request in progress, if any
const announce = text => $("#announce").textContent = text;
form.addEventListener("submit", e => {
  e.preventDefault();
  const question = input.value.trim();
  if (question && !current) ask(question, 0);
});
// While Samara works, Ask is Stop. Closing the request makes the server stop at
// its next step and drop the half-finished turn (agent.ask).
go.addEventListener("click", e => {
  if (current) { e.preventDefault(); current.abort(); }
});

// harder > 0 asks the last question again on a dearer model (see agent.py).
// The ladder is as long as SAMARA_MODEL makes it: Ultrathink is always its top
// step, Think harder every step below, and the button names the model it asks.
let level = 0;       // steps up the ladder this conversation has gone; 0 is the default model
let atTop = false;   // whether that step is the top one
// Follow-ups stay at the level asked for (agent.py); the box says so, as the
// gentle nudge back to the cheaper default.
const setPlaceholder = () => input.placeholder = !level ? "Ask a follow-up question, or something new"
  : `Follow-ups keep ${atTop ? "ultrathinking" : "thinking harder"}. Start over for quick answers.`;
const retryNote = (top, model) => top
  ? `Really putting my back into it: asking ${model}, the most capable model.`
  : `Rolling up my sleeves: asking again with ${model}.`;
// What the answer cost, from the API's token counts (agent.spend): a price where
// Samara knows the model's rates, otherwise the token count.
// Under a cent shows as "< $0.01": fractions of a cent are noise to a reader.
// The exact figure is on the summary's tooltip.
// With it, how long the answer took: on a local model, time is the cost.
const took = s => { if (s == null) return ""; const r = Math.round(s);
  return r < 60 ? `${r}s` : `${Math.floor(r / 60)}m ${String(r % 60).padStart(2, "0")}s`; };
const costText = t => [t.cost != null ? (t.cost < 0.01 ? "< $0.01" : `≈ $${t.cost.toFixed(2)}`)
  : t.tokens ? `${(t.tokens / 1000).toFixed(1)}k tokens` : "", took(t.seconds)].filter(Boolean).join(" · ");
const workedOut = (n, model, t) => `How I worked this out (${[`${n} ${n === 1 ? "query" : "queries"}`,
  model, t && costText(t)].filter(Boolean).join(" · ")})`;
// The answer ends with the model's own "How I worked this out" section; fold it
// in with the queries, so the answer reads short and the working is one click away.
function splitWorked(text) {
  const m = text.match(/^(?:#{1,4}\s+|\*\*)?How I worked (?:this |it )?out\b.*$/im);   // the model varies "this"/"it"
  return m ? [text.slice(0, m.index), text.slice(m.index + m[0].length)] : [text, ""];
}
// "Queries run" is a script: paste it into bash or zsh to get the same data
// again without Samara. Each elm query saves its rows to a file; each jq step
// reads the ones it names ($d1, $d2 ...), as Samara itself does.
const producers = {};   // dataset -> the elm command that made it, across questions
const shq = s => `'${s.replace(/'/g, `'\\''`)}'`;
// The script names the profile Samara used, so a rerun reaches the same portal
// with the same allowed_commands, not whatever the reader's default points at.
function withProfile(cmd) {
  const prof = (health && health.profile || "").replace(/\.ini$/, "");
  return /^[\w.-]+$/.test(prof) ? cmd.replace(/^elm /, `elm --profile ${prof} `) : cmd;
}
function scriptOf(entries) {   // -> [{cmd, note}]; cmd is what gets copied
  const out = [], made = new Set();
  for (const e of entries) {
    if (e.dataset) {
      out.push({ cmd: `${withProfile(e.command)} > "$t/${e.dataset}.jsonl"`, note: e.result }); made.add(e.dataset);
    } else if (e.expression !== undefined) {
      const ds = [...new Set(e.expression.match(/\$d\d+/g) || [])].map(d => d.slice(1));
      for (const d of ds) if (!made.has(d) && producers[d]) {   // made for an earlier question
        out.push({ cmd: `${withProfile(producers[d])} > "$t/${d}.jsonl"`, note: "from an earlier question" }); made.add(d);
      }
      const slurp = ds.map(d => `--slurpfile ${d} "$t/${d}.jsonl" `).join("");
      out.push({ cmd: `jq -n ${slurp}${shq(e.expression)}`, note: e.title ? `the table "${e.title}"` : "" });
    } else if (/^(failed|error)/.test(e.result)) {   // elm failed, or the tool call itself was wrong
      out.push({ cmd: "", note: `failed, left out: ${e.command}` });
    } else {
      out.push({ cmd: withProfile(e.command), note: e.result });   // a total (-C)
    }
  }
  if (made.size) {   // the rows are portal data: keep them only while the script runs
    out.unshift({ cmd: "t=$(mktemp -d)", note: "where each query's rows are saved" });
    out.push({ cmd: 'rm -r "$t"', note: "and removed again" });
  }
  return out;
}
// No # comments in what is copied: zsh, the macOS shell, does not treat # as a
// comment when pasted, so the notes would reach elm as arguments.
const scriptText = entries => scriptOf(entries).filter(l => l.cmd).map(l => l.cmd).join("\n");
function addScript(t, entry) {
  t.md.script.push(entry);
  t.steps.hidden = false;
  $(".queries-head", t.steps).hidden = false;
  const pre = $("pre.script", t.steps);
  pre.hidden = false;
  pre.innerHTML = scriptOf(t.md.script).map(l =>
    `<span class="ln"${l.note ? ` data-note="${esc((l.cmd ? "   " : "") + l.note)}"` : ""}>${esc(l.cmd)}</span>`).join("\n");
}

async function ask(question, harder, next) {   // next: {model, top} of the step Think harder asks
  document.body.classList.add("has-results");
  input.value = "";
  if (harder) { level = harder; atTop = next.top; }
  setPlaceholder();
  // Only the newest answer can be retried or extended: the server forgets the
  // one Think harder replaces, and Dig deeper continues from the latest.
  document.querySelectorAll(".harder, .more-detail").forEach(b => b.remove());
  const earlier = harder ? results.firstElementChild : null;
  if (earlier) { earlier.classList.add("earlier"); $(".earlier-toggle", earlier).hidden = false; }

  const turn = document.createElement("section");
  turn.className = "turn";
  turn.innerHTML = `<div class="question"><span>${esc(question)}</span>
      <span class="actions">
        <button class="secondary earlier-toggle" type="button" hidden>Show earlier answer</button>
      </span></div>
    ${harder ? `<p class="retry-note">${esc(retryNote(next.top, next.model))}</p>` : ""}
    <div class="part"></div>
    <details class="steps" hidden><summary>How I worked this out</summary>
      <div class="worked"></div>
      <div class="queries-head" hidden><span>Queries run <small>(paste into a shell to run them again; read them first)</small></span>
        <button class="secondary copy-script" type="button" title="Copy the queries as a script to run with elm">Copy</button></div>
      <pre class="script" hidden></pre></details>
    <div class="turn-foot">
      <span class="exports">
        <button class="secondary icon copy" type="button" title="Copy this answer as Markdown" hidden>${ICON.md}Copy</button>
        <button class="secondary icon csv" type="button" title="Download the tables as CSV" hidden>${ICON.csv}CSV</button>
        <button class="link md-toggle" type="button" title="Show the Markdown, to read or download" aria-label="Show the Markdown" aria-pressed="false" hidden>${ICON.source}</button>
      </span>
      <span class="buttons">
        <button class="link more-detail" type="button" title="Look further in the portal: patterns, likely causes, what to check next" hidden>Dig deeper</button>
        <button class="secondary harder" type="button" title="Ask this again on a more capable model" hidden></button>
      </span>
    </div>
    <div class="markdown-view" hidden>
      <textarea readonly></textarea>
      <div class="row"><button class="secondary download" type="button">Download</button>
        <span class="note"></span></div>
    </div>`;
  results.prepend(turn);
  const t = { turn, steps: $(".steps", turn), stepCount: 0, more: false, level,
              md: { question, answer: "", detail: "", tables: [], script: [], model: "" } };

  $(".earlier-toggle", turn).addEventListener("click", e => {
    e.target.textContent = turn.classList.toggle("open") ? "Hide earlier answer" : "Show earlier answer";
  });
  $(".harder", turn).addEventListener("click", () => {
    // Asked whenever the next step sends data somewhere this one did not (a local model, then Claude).
    if (t.off && !confirm(`This sends your question, and the portal data Samara reads to answer it, to ${t.off}. Proceed?`)) return;
    if (!t.off && t.next.top && !confirm("Uses more tokens. Proceed?")) return;
    ask(question, t.level + 1, t.next);
  });
  $(".more-detail", turn).addEventListener("click", e => {
    e.target.remove();
    const part = document.createElement("div");
    part.className = "part detail";
    $(".steps", turn).before(part);
    stream(t, part, { detail: true }, ev => {
      t.md.detail = ev.markdown;
      return "Dig deeper";
    });
  });
  $(".copy-script", turn).addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(scriptText(t.md.script)); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Select and copy"; }
    setTimeout(() => e.target.textContent = "Copy", 2000);
  });
  const view = $(".markdown-view", turn), box = $("textarea", view), note = $(".note", view);
  const showMarkdown = open => {
    view.hidden = !open;
    const b = $(".md-toggle", turn);   // </>, the usual "view source" icon (GitHub's Code view of a Markdown file)
    b.setAttribute("aria-pressed", open);
    b.title = open ? "Hide the Markdown" : "Show the Markdown, to read or download";
    if (open) { box.value = answerMarkdown({ ...t.md, costText: costText(t) }); note.textContent = ""; }
  };
  $(".md-toggle", turn).addEventListener("click", () => showMarkdown(view.hidden));
  // Copy in one click. The clipboard needs a secure page (https or localhost):
  // elsewhere, open the Markdown and select it for ctrl/cmd-C instead.
  $(".copy", turn).addEventListener("click", async e => {
    const b = e.currentTarget;
    try {
      await navigator.clipboard.writeText(answerMarkdown({ ...t.md, costText: costText(t) }));
      b.innerHTML = ICON.md + "Copied";
      setTimeout(() => b.innerHTML = ICON.md + "Copy", 2000);
    } catch {
      showMarkdown(true); box.select(); note.textContent = "Press ctrl/cmd-C to copy";
    }
  });
  $(".download", turn).addEventListener("click", () =>
    saveFile(slug(question) + ".md", box.value, "text/markdown"));
  $(".csv", turn).addEventListener("click", () => {
    // One table, one file; several tables, one file each, named after the table.
    t.md.tables.forEach(tb => saveFile(
      (t.md.tables.length === 1 ? slug(question) : slug(tb.title)) + ".csv",
      [tb.columns, ...tb.rows].map(r => r.map(csvCell).join(",")).join("\n"), "text/csv"));
  });

  await stream(t, $(".part", turn), { question, harder }, ev => {
    t.md.answer = ev.markdown;
    $(".copy", turn).hidden = false;
    $(".md-toggle", turn).hidden = false;
    $(".more-detail", turn).hidden = false;
    if (t.more || t.level) {   // a harder model left, or a note that there is none
      const b = $(".harder", turn);
      b.hidden = false; b.disabled = !t.more;
      b.title = !t.more ? "" : `Ask this again on ${t.next.model}${t.off ? `, at ${t.off}` : ""}`;
      b.textContent = !t.more ? "That's my best" : `${t.next.top ? "Ultrathink" : "Think harder"} · ${t.next.model}`;
      b.classList.toggle("rainbow", t.more && t.next.top);
    }
    return "";
  });
}

// One request, streamed into `part` of a card: its status line, tables and
// answer. Queries go into the card's shared "How I worked this out"; onAnswer
// records the answer and returns a heading for its working ("" for none).
async function stream(t, part, body, onAnswer) {
  current = new AbortController();
  go.textContent = "Stop"; go.classList.add("stop");
  announce("Working on it");
  let answered = false, failed = "", stopped = false;   // Keep going after a Stop, Try again after an error
  const began = Date.now();
  t.turn.querySelectorAll(".buttons button").forEach(b => b.disabled = true);
  part.innerHTML = `<div class="status"><span class="spinner"></span><span class="status-text">Starting...</span></div>
    <div class="answer"></div><div class="tables"></div>`;
  const statusText = $(".status-text", part), steps = t.steps;
  const handle = ev => {
    switch (ev.type) {
      case "conversation": conversationId = ev.id; break;
      case "model":
        if (!body.detail) {
          t.md.model = ev.id; t.more = ev.more; t.off = ev.off; t.next = ev.next;
          // The server's level is the truth (a conversation it forgot starts at 0 again).
          if (ev.level !== undefined) { t.level = level = ev.level; atTop = !ev.more; setPlaceholder(); }
        }
        break;
      case "usage":   // summed over the card: the answer, then any Dig deeper
        t.tokens = (t.tokens || 0) + ev.tokens;
        t.seconds = (t.seconds || 0) + (Date.now() - began) / 1000;
        t.cost = ev.cost == null || t.cost === null ? null : (t.cost || 0) + ev.cost;
        steps.hidden = false;
        $("summary", steps).title = t.cost != null ? `$${t.cost.toFixed(4)}, ${t.tokens} tokens` : `${t.tokens} tokens`;
        $("summary", steps).textContent = workedOut(t.stepCount, t.md.model, t);
        break;
      case "status": statusText.textContent = ev.text.length > 160 ? ev.text.slice(0, 160) + "..." : ev.text; break;
      case "step":
        if (ev.dataset) producers[ev.dataset] = ev.command;
        addScript(t, ev);
        $("summary", steps).textContent = workedOut(++t.stepCount, t.md.model, t);
        break;
      case "table":
        addScript(t, { expression: ev.expression, title: ev.title });
        t.md.tables.push(ev);
        $(".tables", part).append(renderTable(ev));
        $(".csv", t.turn).hidden = false;
        break;
      case "answer": {
        const [main, worked] = splitWorked(ev.markdown);
        $(".answer", part).innerHTML = markdown(main);
        const heading = onAnswer(ev);
        answered = true;
        if (worked.trim()) {
          $(".worked", steps).insertAdjacentHTML("beforeend",
            (heading ? `<p class="queries-label">${esc(heading)}</p>` : "") + markdown(worked));
          steps.hidden = false;
        }
        break;
      }
      case "error": failed = ev.text; break;
    }
  };
  try {
    const resp = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: current.signal,
      body: JSON.stringify({
        ...body, conversation_id: conversationId,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,     // e.g. Australia/Sydney
        utc_offset_minutes: -new Date().getTimezoneOffset(),            // e.g. 600
      }),
    });
    if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
    const reader = resp.body.getReader(), decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (line.trim()) handle(JSON.parse(line));
      }
    }
  } catch (err) {
    stopped = err.name === "AbortError";
    failed = stopped ? "Stopped." : `Request failed: ${err.message}`;
  } finally {
    current = null;
    go.textContent = "Ask"; go.classList.remove("stop");
    $(".status", part).remove();
    // A stopped or failed request can be sent again as it was. The server has
    // already dropped the half-finished turn, so start this one clean too.
    if (failed) {
      $(".answer", part).insertAdjacentHTML("beforeend",
        `<p class="error">${esc(failed)} <button class="link retry" type="button">${stopped ? "Keep going" : "Try again"}</button></p>`);
      $(".retry", part).addEventListener("click", () => {
        if (!body.detail) resetWorking(t);
        stream(t, part, body, onAnswer);
      });
    }
    announce(failed || (answered ? "Answer ready" : ""));
    if (t.stepCount || t.tokens) $("summary", steps).textContent = workedOut(t.stepCount, t.md.model, t);
    t.turn.querySelectorAll(".buttons button").forEach(b => { if (b.textContent !== "That's my best") b.disabled = false; });
    input.focus();
  }
}

// Forget a question's working before it is asked again (Try again).
function resetWorking(t) {
  t.md.script.length = 0; t.md.tables.length = 0; t.stepCount = 0; t.tokens = 0; t.cost = undefined; t.seconds = undefined;
  $(".worked", t.steps).innerHTML = ""; $("pre.script", t.steps).textContent = "";
  $(".queries-head", t.steps).hidden = true; t.steps.hidden = true;
  $("summary", t.steps).textContent = "How I worked this out";
  $(".csv", t.turn).hidden = true;
}
</script>
</body>
</html>
