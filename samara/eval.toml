# Collectors

[[case]]
q = "which collectors are down?"
recipe = ["collectors_down"]
fact = ["$ELM CollectorList -c -s0 -F isDown:true", "$ELM CollectorList -c -s0"]

[[case]]
q = "show me the down collectors"
after = ["is {device} up?", "are all collectors healthy?"]
fact = ["$ELM CollectorList -c -s0 -F isDown:true"]
never = ["\\| *(123|456) *\\|"]   # ids made up on 2026-10-31

[[case]]
q = "Is collector {collector} okay?"
recipe = ["collector_health"]

[[case]]
q = "is collector {collector} keeping up?"
recipe = ["collector_keeping_up"]
says = ["kept up|fell behind"]

[[case]]
q = "When did collector {collector_down} go down?"
recipe = ["collector_health", "collectors_down"]

[[case]]
q = "which devices are on the first one?"
after = ["which collectors are down?"]
recipe = ["collector_health"]

[[case]]
q = "Can you add a percentage to that table?"
after = ["which collector has the most dead devices?"]
column = ["%|percent"]   # typed by the model, then dropped, 2026-10-31

# Alerts

[[case]]
q = "What's critical right now?"
recipe = ["critical_alerts"]
fact = ["$ELM AlertList -c -s0 -F cleared:false,severity:4"]

[[case]]
q = "How many alerts are open right now?"
recipe = ["open_alerts", "portal_health"]
fact = ["$ELM AlertList -c -s0 -F cleared:false"]

[[case]]
q = "Which device has the most open alerts?"
recipe = ["top_alert_devices"]

[[case]]
q = "How many alerts started yesterday?"
recipe = ["alerts"]
fact = ["$ELM AlertList -c -s0 -F 'cleared:*,startEpoch:{yesterday}'"]

[[case]]
q = "What alerts cleared in the last hour?"
recipe = ["alerts"]
fact = ["$ELM AlertList -c -s0 -F 'cleared:true,endEpoch>:now-1h'"]
slack = 1   # the hour moves between the answer and the check: 9, then 10 (2026-11-01)

[[case]]
q = "are any alerts still open that started during SDT?"
recipe = ["alerts"]
fact = ["$ELM AlertList -c -s0 -F cleared:false,sdted:true"]

# Downtime

[[case]]
q = "is any work planned this weekend?"
recipe = ["downtime"]

[[case]]
q = "Which SDTs start in the next 3 days?"
recipe = ["downtime"]
# not in effect yet, starting within 3 days: the 4B said "none" from a query that cannot work (2026-11-01)
fact = ["$ELM -f jsonl SDTList -s0 -f isEffective,startDateTime | jq -s '[.[] | select((.isEffective | not) and .startDateTime > now * 1000 and .startDateTime < now * 1000 + 3 * 86400000)] | length'"]
never = ["\\[(Another )?Device( Name)?\\]"]   # placeholder rows, 2026-10-31

