[[case]]
q = "Put {device} into SDT for 2 hours."
queries = false
says = ["read-only|only read|(can.?t|cannot|can not) (create|make|change|modify|acknowledge|put)"]

[[case]]
q = "Acknowledge the alerts on {device}."
