# Checked answers to the questions people ask most. Format: recipes.py.
# Every summary and table is jq over the steps' rows ($<as>), with the
# helpers in recipes.py PRELUDE (sev, at, n, severities, kind, updown, state,
# ver, disabled_by). Check a new or changed recipe against the portal with elm
# and add it to questions.md.

# --- One device -------------------------------------------------------------

- name: device_health
  asks: ["is DEVICE okay?", "what's wrong with DEVICE?", "what alerts are open on DEVICE?", "how many open alerts does DEVICE have, by severity?", "what's the latest alert on DEVICE?", "is DEVICE down and since when?", "why didn't DEVICE alert?"]
  covers: "one device now: up or down, its open alerts, downtime and collector"
  params: [device]
  steps:
    - as: alerts
      run: AlertListByDeviceId
      params: {id: "{device[id]}"}
      filter: cleared:false
      fields: [severity, startEpoch, acked, ackComment, ackedBy, sdted, resourceTemplateName, instanceName, dataPointName]
      size: all
      says: fetched its open alerts
    - as: sdts
      run: AllSDTListByDeviceId
      params: {id: "{device[id]}"}
      fields: [isEffective, startDateTime, endDateTime, sdtType]
      says: checked its scheduled downtime
    - as: collector
      run: CollectorById
      params: {id: "{device[currentCollectorId]}"}
      fields: [id, description, isDown]
      when: $device[0].currentCollectorId > 0
      says: checked its collector
  summary: |
    $device[0] as $d | (now * 1000) as $ms
    | ($sdts | map(select(.isEffective))) as $on
    | ($sdts | map(select((.isEffective | not) and .startDateTime > $ms)) | sort_by(.startDateTime)) as $next
    | ($alerts | map(select(.resourceTemplateName == "Host Status" and .dataPointName == "idleInterval"))
       | min_by(.startEpoch)) as $since
    | ($d.alertDisableStatus | disabled_by) as $off
    | ($alerts | map(select(.acked)) | length) as $acked
    | (if $d.hostStatus != "normal" then "No"
       elif any($alerts[]; .severity >= 3) then "Needs a look"
       elif ($alerts | length) > 0 then "Mostly" else "Yes" end)
    + ": \($d.displayName) is \($d.hostStatus | updown)"
    # The Host Status alert's start is when it stopped reporting: "since" for a
    # device that is down; for one LM still calls up, say the check has no data
    # (it read "up (since 18:26)", the time it went quiet, 2026-10-31).
    + (if $since == null then ""
       elif $d.hostStatus == "normal" then ", but its Host Status check has had no data from it since \($since.startEpoch | at)"
       else " (since \($since.startEpoch | at))" end)
    + ", with "
    + (if ($alerts | length) == 0 then "no open alerts"
       else "\($alerts | length | n("open alert")) (\($alerts | severities))"
            + (if $acked > 0 then ", \($acked) acknowledged" else "" end) end)
    + (if ($on | length) > 0 then "; it is in scheduled downtime until \($on[0].endDateTime / 1000 | at)"
       else "; no downtime is in effect" end)
    + (if ($next | length) > 0 then "; the next is scheduled for \($next[0].startDateTime / 1000 | at)" else "" end)
    + (if ($off | length) > 0 then ". Alerting is disabled by \($off | join(" and by ")), so problems there would not alert" else "" end)
    + (if $collector[0].isDown and $d.hostStatus != "dead-collector" then ". Its collector (\($collector[0].description)) is down, so its data is not current" else "" end)
    + "."
  table:
    title: Open alerts on {device[displayName]}
    columns: [Severity, Alert, Started, Acknowledged]
    rows: |
      $alerts | sort_by(-.severity, -.startEpoch) | map({
        Severity: (.severity | sev),
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")),
        Started: (.startEpoch | at),
        Acknowledged: ack})

- name: device_downtime
  asks: ["is any downtime scheduled for DEVICE?", "is DEVICE in maintenance?", "when is DEVICE's next SDT?"]
  covers: "one device's downtime, now and scheduled"
  params: [device]
  steps:
    - as: sdts
      run: AllSDTListByDeviceId
      params: {id: "{device[id]}"}
      fields: [type, isEffective, startDateTime, endDateTime, sdtType]
      says: fetched the downtime that applies to it, its own and its groups'
  summary: |
    (now * 1000) as $ms
    | ($sdts | map(select(.isEffective))) as $on
    | ($sdts | map(select((.isEffective | not) and .startDateTime > $ms)) | sort_by(.startDateTime)) as $next
    | "\($device[0].displayName): "
    + (if ($on | length) > 0 then "in scheduled downtime now, until \($on[0].endDateTime / 1000 | at)"
       else "no downtime in effect now" end)
    + (($next | length) as $k | if $k > 0
       then "; \($k) more \(if $k == 1 then "is" else "are" end) scheduled, the next \($next[0].startDateTime / 1000 | at)"
       else "; nothing else is scheduled" end) + "."
  table:
    title: Downtime for {device[displayName]}
    columns: [Starts, Ends, Repeats, Set on, In effect now]
    rows: |
      $sdts | sort_by(.startDateTime) | map({
        Starts: (.startDateTime / 1000 | at), Ends: (.endDateTime / 1000 | when),
        Repeats: ({"oneTime": "no", "daily": "daily", "weekly": "weekly", "monthly": "monthly",
                   "monthlyByWeek": "monthly"}[.sdtType] // .sdtType),
        "Set on": (if .type == "ResourceSDT" then "this device" elif .type == "DeviceGroupSDT" then "a group it is in"
                   else .type end),
        "In effect now": (if .isEffective then "yes" else "no" end)})

- name: device_collector
  asks: ["which collector monitors DEVICE?", "is DEVICE's collector okay?"]
  covers: "which collector monitors one device, and whether it is up"
  params: [device]
  steps:
    - as: collector
      run: CollectorById
      params: {id: "{device[currentCollectorId]}"}
      fields: [id, description, hostname, isDown, inSDT, numberOfHosts, collectorGroupName, backupAgentId, upTime, build]
      when: $device[0].currentCollectorId > 0
      says: fetched its collector
  summary: |
    $device[0] as $d | $collector[0] as $c
    | if $c == null then "\($d.displayName) is not monitored through a collector (it is a \($d.deviceType | kind))."
      else "\($d.displayName) is monitored by collector \($c.description) (id \($c.id), group \($c.collectorGroupName)). "
      + "The collector is \(if $c.isDown then "DOWN" else "up" end)"
      + (if $c.inSDT then ", in scheduled downtime" else "" end)
      + (if $c.isDown | not then ", running for " + (if $c.upTime < 86400 then $c.upTime / 3600 | floor | n("hour")
         else $c.upTime / 86400 | floor | n("day") end) else "" end)
      + "; it monitors \($c.numberOfHosts | n("device"))"
      + (if $c.backupAgentId > 0 then " and fails over to collector \($c.backupAgentId)" else " and has no failover collector" end)
      + "." end

- name: device_properties
  asks: ["what properties does DEVICE have?", "what custom properties does DEVICE have?", "what OS is DEVICE running?", "what is DEVICE's property X?"]
  covers: "how many properties one device has, and its OS (the values are in the table)"
  params: [device]
  steps:
    - as: props
      run: DeviceById
      params: {id: "{device[id]}"}
      fields: [customProperties, inheritedProperties, systemProperties, autoProperties]
      says: fetched its properties, its own and those it inherits from its groups
  table_only: true
  # Counts only: property values are free text anyone with access can set, and
  # a small model repeated a planted "decommissioned" note as fact (qwen3-8b,
  # 2026-10-29). The reader gets the values in the table; the model never does.
  # The exceptions are the OS line the device reports (system.sysinfo),
  # quoted, trimmed and cut to 100 characters: without it the model made one up;
  # and a few system properties LM fills in itself. Not every system.* name is
  # safe: system.description, displayname, groups and collectordesc are typed
  # by people, and a test device's system.description carries the planted text.
  summary: |
    $props[0] as $p
    | "\($device[0].displayName) has \($p.customProperties | length) custom properties"
    + " set on the device itself, \($p.inheritedProperties | length) inherited from its groups, "
    + "\($p.systemProperties | length) system and \($p.autoProperties | length) discovered (auto) properties. "
    + ($p.systemProperties | map(select(.name == "system.sysinfo" and .value != "")) | first
       | if . then "It reports its operating system as \"\(.value | gsub("[^A-Za-z0-9 .,:()/_#+-]"; "") | .[:100])\". "
         else "It does not report an operating system. " end)
    + ($p.systemProperties | map(select(.name | IN("system.ips", "system.sysoid", "system.hoststatus",
         "system.collectorplatform", "system.collectorarch", "system.collectorversion")) | select(.value != ""))
       | if length > 0 then "Some of its system properties: "
           + (map("\(.name) = \(.value | gsub("[^A-Za-z0-9 .,:_-]"; "") | .[:60])") | join("; ")) + ". "
         else "" end)
    + "All of them are in the table: read the values there."
  table:
    title: Properties of {device[displayName]}
    columns: [Property, Value, Set on]
    rows: |
      $props[0] as $p
      | [["customProperties", "this device"], ["inheritedProperties", "a group it is in"],
         ["systemProperties", "system"], ["autoProperties", "discovered"]]
      | map(.[1] as $on | $p[.[0]] | sort_by(.name) | map({Property: .name, Value: .value, "Set on": $on})) | add

- name: device_memory
  asks: ["how much memory is DEVICE using?", "is DEVICE short of memory?", "what's DEVICE's memory usage?"]
  covers: "one device's memory use over the last hour"
  params: [device]
  steps:
    - as: dss
      run: DeviceDatasourceList
      params: {deviceId: "{device[id]}"}
      fields: [id, dataSourceName, instanceNumber]
      size: all
      says: listed the checks (DataSources) applied to it
    - as: insts
      run: DeviceDatasourceInstanceList
      each: |
        $dss | map(select(.instanceNumber > 0 and (.dataSourceName | test("(?i)mem|hostperformance"))
          and (.dataSourceName | test("(?i)jvm|memcache") | not)))
      params: {deviceId: "{device[id]}", hdsId: "{row[id]}"}
      fields: [id, name]
      says: found the instances of its memory checks
    - as: data
      run: DeviceDatasourceInstanceData
      each: '$insts | map({hds: .of.id, id})'
      params: {deviceId: "{device[id]}", hdsId: "{row[hds]}", id: "{row[id]}", period: 1}
      says: fetched the last hour of each one's data
  # Memory checks differ by device type (NetSNMP, Windows, vendor ones), so
  # this takes any applied DataSource with "mem" in its name, plus VMware's
  # HostPerformance (memory datapoints in a general check) for its mem* values. A collector's own
  # memory check is the collector program, not the server: a model once gave it
  # as the server's memory (questions.md), so it is named separately, last.
  # Values come newest first; "No Data" is LM's word for a missed poll.
  summary: |
    def latest: [range(.dataPoints | length) as $i
      | {ds: .dataSourceName, dp: .dataPoints[$i], v: (first(.values[] | .[$i] | select(. != "No Data")) // null)}]
      | map(select((.ds | test("(?i)mem")) or (.dp | test("(?i)mem"))));
    def num: if type == "number" then (. * 10 | round / 10) else . end;
    ($data | map(latest) | add // []) as $all
    | ($all | map(select(.ds | test("(?i)^LogicMonitor_Collector") | not))) as $os
    | ($all | map(select(.ds | test("(?i)^LogicMonitor_Collector")))) as $coll
    | ($os | map(select(.v != null and (.dp | test("(?i)percent|util")) and (.dp | test("(?i)swap") | not)))) as $pct
    | ($os | map(.ds) | unique) as $checks
    | $device[0].displayName as $name
    | (if ($pct | length) > 0 then "\($name)'s memory, latest in the last hour: "
         + ($pct | map("\(.dp) \(.v | num)% (\(.ds))") | join("; ")) + "."
       elif ($os | map(select(.v != null)) | length) > 0 then "\($name)'s memory checks (\($checks | join(", "))) "
         + "report values but no percentage: they are in the table."
       elif ($checks | length) > 0 then "\($name)'s memory use is not available: its memory checks "
         + "(\($checks | join(", "))) returned no data in the last hour."
       else "\($name)'s memory use is not available: none of its \($dss | length) checks is a memory check this recipe knows." end)
    + ($coll | map(select(.dp == "CollectorMemory" and .v != null)) | first
       | if . then " Separately, the LogicMonitor collector program running on it is using "
           + "\(.v / 1048576 | round) MB; that is the collector, not the server's memory." else "" end)
  table:
    title: Memory checks on {device[displayName]}, last hour
    columns: [Check, Datapoint, Latest value]
    rows: |
      $data | map(. as $d | [range(.dataPoints | length) as $i
        | {Check: $d.dataSourceName, Datapoint: $d.dataPoints[$i],
           "Latest value": (first($d.values[] | .[$i] | select(. != "No Data")) // "no data")}]) | add // []
      | map(select(((.Check | test("(?i)^LogicMonitor_Collector") | not) or .Datapoint == "CollectorMemory")
          and ((.Check | test("(?i)mem")) or (.Datapoint | test("(?i)mem")))))

- name: find_device
  asks: ["is DEVICE monitored?", "do we monitor DEVICE?", "find DEVICE", "which device has IP or hostname X?"]
  covers: "whether a device is monitored, and whether it is up"
  params: [device]
  many: true
  summary: |
    if ($device | length) == 1 then $device[0] as $d
      | "Yes: \($d.displayName) (hostname or IP \($d.name)) is monitored, a \($d.deviceType | kind), currently \($d.hostStatus | updown)."
    else "\(if ($device | length) == 20 then "At least 20" else $device | length end) monitored objects match that name: see the table."
    end
  table:
    title: Matching devices
    columns: [Device, Hostname or IP, Kind, Status, Collector]
    rows: |
      $device | map({Device: .displayName, "Hostname or IP": .name, Kind: (.deviceType | kind),
                     Status: (.hostStatus | state), Collector: .collectorDescription})

# --- Whole portal -------------------------------------------------------------

- name: portal_health
  asks: ["give me a health summary", "how is everything this morning?", "what needs attention first?", "is everything okay?"]
  covers: "the whole portal now: collectors down, devices down, open alerts"
  steps:
    - as: collectors
      run: CollectorList
      fields: [id, description, isDown, numberOfHosts, backupAgentId, watchdogUpdatedOn]
      size: all
      says: fetched every collector
    - as: down
      run: DeviceList
      filter: hostStatus~dead
      fields: [id, hostStatus, deviceType]
      size: all
      says: fetched every device that is down
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [severity, acked, sdted, startEpoch, resourceTemplateName, monitorObjectName]
      size: all
      says: fetched every open alert
  # Ranked the way an ops person works through it: collectors first (one down
  # collector blinds every device on it), then devices not responding, then
  # alerts. Host Status alerts are the dead devices again, so they are left
  # out of the alert counts. Collectors silent for over 30 days are old news.
  summary: |
    ($collectors | map(select(.isDown))) as $cdown
    | ($cdown | map(select(.watchdogUpdatedOn > now - 30 * 86400))) as $recent
    | ($down | map(select(.deviceType == 0))) as $dev
    | ($alerts | map(select(.resourceTemplateName != "Host Status"))) as $al
    | ($al | map(select(.severity >= 3))) as $bad
    | ($al | map(select((.acked | not) and (.sdted | not) and .startEpoch < now - 86400))) as $stale
    | "1. Collectors: \($cdown | length) of \($collectors | length) down"
    + (if ($recent | length) > 0 then ", \($recent | length) of them in the last 30 days (\($recent | map(.description) | join(", ")))"
       else ", none in the last 30 days" end) + ".\n"
    + "2. Devices: \($dev | map(select(.hostStatus == "dead")) | length) not responding, \($dev | map(select(.hostStatus == "dead-collector")) | length) behind a down collector.\n"
    + "3. Alerts (besides devices down): \($al | length) open, \($bad | length) of them critical or error"
    + (if ($bad | length) > 0 then ", most on " + ($bad | group_by(.resourceTemplateName) | map({t: .[0].resourceTemplateName, n: length})
         | sort_by(-.n) | .[:2] | map("\(.t) (\(.n))") | join(" and ")) else "" end) + ".\n"
    + "4. Neglected: \($stale | length) of those alerts open more than a day with nobody acknowledging them."
  table:
    title: Health summary
    columns: [Area, Count, Detail]
    rows: |
      ($collectors | map(select(.isDown))) as $cdown
      | ($down | map(select(.deviceType == 0))) as $dev
      | ($alerts | map(select(.resourceTemplateName != "Host Status"))) as $al
      | [{Area: "Collectors down", Count: ($cdown | length), Detail: "\($cdown | map(select(.watchdogUpdatedOn > now - 30 * 86400)) | length) in the last 30 days"},
         {Area: "Devices not responding", Count: ($dev | map(select(.hostStatus == "dead")) | length), Detail: ""},
         {Area: "Devices behind a down collector", Count: ($dev | map(select(.hostStatus == "dead-collector")) | length), Detail: ""},
         {Area: "Open alerts (besides devices down)", Count: ($al | length), Detail: ($al | severities)},
         {Area: "Alerts unacknowledged for over a day", Count: ($al | map(select((.acked | not) and (.sdted | not) and .startEpoch < now - 86400)) | length), Detail: ""}]

- name: devices_down
  asks: ["which devices are down?", "what's offline?", "what's not responding?", "how many devices are dead, and since when?"]
  covers: "devices down now, across the portal"
  steps:
    - as: down
      run: DeviceList
      filter: hostStatus~dead
      fields: [id, displayName, hostStatus, deviceType, collectorDescription]
      size: all
      says: fetched every device that is not responding or whose collector is down
    - as: hs
      run: AlertList
      filter: 'cleared:false,resourceTemplateName:"Host Status"'
      fields: [monitorObjectId, startEpoch]
      size: all
      says: fetched the open Host Status alerts, whose start is when each device stopped responding
  # LM keeps no "down since" on the device; its open Host Status alert started
  # then. Devices behind a down collector usually have none.
  summary: |
    ($down | map(select(.deviceType == 0))) as $real | ($down | map(select(.deviceType != 0))) as $other
    | ($hs | group_by(.monitorObjectId) | map({key: "\(.[0].monitorObjectId)", value: (map(.startEpoch) | min)}) | from_entries) as $since
    | ($real | map(select(.hostStatus == "dead"))) as $dead
    | ($dead | map($since["\(.id)"] // empty)) as $starts
    | ($real | map(select(.hostStatus == "dead-collector"))) as $nocoll
    | "\($real | length | n("device")) down: \($dead | length) not responding, and \($nocoll | length) not being "
    + "monitored because their collector is down (\($nocoll | map(.collectorDescription) | unique | length | n("collector")))."
    + (if ($other | length) > 0 then " Left out: \($other | length) objects that are not devices ("
       + ($other | group_by(.deviceType) | map("\(.[0].deviceType | kind): \(length)") | join(", ")) + ")." else "" end)
    + (if ($starts | length) > 0 then " Of the ones not responding, the longest has been down since \($starts | min | at)"
       + "; \($starts | map(select(. > now - 86400)) | length) stopped in the last day, "
       + "\($starts | map(select(. < now - 365 * 86400)) | length) over a year ago"
       + (($dead | length) - ($starts | length) | if . > 0 then "; \(.) have no open Host Status alert, so no start date (alerting may be off for them)" else "" end)
       + "." else "" end)
  table:
    title: Devices that are down, longest first
    columns: [Device, Status, Down since, Collector]
    rows: |
      ($hs | group_by(.monitorObjectId) | map({key: "\(.[0].monitorObjectId)", value: (map(.startEpoch) | min)}) | from_entries) as $since
      | $down | map(select(.deviceType == 0)) | map(. + {s: $since["\(.id)"]}) | sort_by(.hostStatus, .s // 9e9, .displayName)
      | map({Device: .displayName, Status: (.hostStatus | state), "Down since": (if .s then .s | at else "" end),
             Collector: .collectorDescription})

- name: collectors_down
  asks: ["which collectors are down?", "are all our collectors up?", "how long have the collectors been down?"]
  covers: "collectors down now"
  steps:
    - as: collectors
      run: CollectorList
      fields: [id, description, hostname, collectorGroupName, isDown, inSDT, numberOfHosts, watchdogUpdatedOn]
      size: all
      says: fetched every collector, whether it is down and when it was last heard from
  # A down collector's last heartbeat (watchdogUpdatedOn) is when it went
  # quiet; most down collectors on a long-lived portal are old and forgotten,
  # so the newest outage is the one worth naming.
  summary: |
    ($collectors | map(select(.isDown))) as $dn
    | "\($dn | length) of \($collectors | length) collectors are down"
    + (if ($dn | length) > 0 then ", between them monitoring \($dn | map(.numberOfHosts) | add | n("device"))"
       + (($dn | map(select(.inSDT)) | length) as $s | if $s > 0 then "; \($s) of them in scheduled downtime" else "; none is in scheduled downtime" end)
       + ($dn | max_by(.watchdogUpdatedOn) | ". The most recent to go down is \(.description), last heard from \(.watchdogUpdatedOn | at)")
       + ($dn | map(select(.watchdogUpdatedOn < now - 365 * 86400)) | length | if . > 0 then "; \(.) have not been heard from for over a year" else "" end)
       else "" end) + "."
  table:
    title: Collectors that are down, most recent first
    columns: [Collector, Group, Devices, Last heard from, In downtime]
    rows: |
      $collectors | map(select(.isDown)) | sort_by(-.watchdogUpdatedOn)
      | map({Collector: .description, Group: .collectorGroupName, Devices: .numberOfHosts,
             "Last heard from": (.watchdogUpdatedOn | at), "In downtime": (if .inSDT then "yes" else "no" end)})

- name: collectors_out_of_date
  asks: ["which collectors are out of date?", "which collectors need upgrading?", "what versions are our collectors on?"]
  covers: "collector versions now, against the newest release"
  steps:
    - as: collectors
      run: CollectorList
      fields: [id, description, collectorGroupName, isDown, numberOfHosts, build]
      size: all
      says: fetched every collector's version
    - as: versions
      run: CollectorVersionList
      fields: [majorVersion, minorVersion, stable, feature, releaseEpoch]
      size: all
      says: fetched LogicMonitor's collector releases and took the newest general release
  # The newest general release: stable, released, not a feature build
  # (majorVersion 10000). Down collectors are counted apart: upgrading one
  # that is down does nothing.
  summary: |
    ($versions | map(select(.stable and (.feature | not) and .releaseEpoch > 0))
     | max_by(.majorVersion * 1000 + .minorVersion) | .majorVersion * 1000 + .minorVersion) as $latest
    | ($collectors | map(select(.isDown | not))) as $up
    | ($up | map(select((.build | tonumber) < $latest))) as $old
    | "The newest collector release is \($latest | ver). \($old | length) of \($up | length) running collectors are older"
    + (if ($old | length) > 0 then " (oldest: \($old | min_by(.build | tonumber) | "\(.description) on \(.build | ver)"))" else "" end)
    + (($up | map(select((.build | tonumber) > $latest)) | length) as $k | if $k > 0 then "; \($k) \(if $k == 1 then "runs a" else "run" end) pre-release build" else "" end)
    + ". \($collectors | length - ($up | length)) down collectors are left out."
  table:
    title: Running collectors older than the newest release
    columns: [Collector, Version, Group, Devices]
    rows: |
      ($versions | map(select(.stable and (.feature | not) and .releaseEpoch > 0))
       | max_by(.majorVersion * 1000 + .minorVersion) | .majorVersion * 1000 + .minorVersion) as $latest
      | $collectors | map(select((.isDown | not) and (.build | tonumber) < $latest)) | sort_by(.build | tonumber)
      | map({Collector: .description, Version: (.build | ver), Group: .collectorGroupName, Devices: .numberOfHosts})

- name: collectors_no_failover
  asks: ["which collectors have no failover?", "where are our single points of failure?", "which collectors have no backup?"]
  covers: "collectors with no failover collector"
  steps:
    - as: collectors
      run: CollectorList
      fields: [id, description, collectorGroupName, isDown, numberOfHosts, backupAgentId]
      size: all
      says: fetched every collector and its failover collector
  # A failover collector that is itself down protects nothing.
  summary: |
    ($collectors | map({key: (.id | tostring), value: .}) | from_entries) as $by
    | ($collectors | map(select((.isDown | not) and .numberOfHosts > 0))) as $up
    | ($up | map(select(.backupAgentId == 0))) as $none
    | ($up | map(select(.backupAgentId > 0 and ($by[.backupAgentId | tostring].isDown // true)))) as $dead
    | "\($none | length) of \($up | length) running collectors with devices have no failover collector, "
    + "between them monitoring \($none | map(.numberOfHosts) | add // 0 | n("device"))"
    + (if ($dead | length) > 0 then "; \($dead | length) more fail over to a collector that is down" else "" end) + "."
  table:
    title: Running collectors with no working failover, most devices first
    columns: [Collector, Group, Devices, Failover]
    rows: |
      ($collectors | map({key: (.id | tostring), value: .}) | from_entries) as $by
      | $collectors | map(select((.isDown | not) and .numberOfHosts > 0
          and (.backupAgentId == 0 or ($by[.backupAgentId | tostring].isDown // true))))
      | sort_by(-.numberOfHosts)
      | map({Collector: .description, Group: .collectorGroupName, Devices: .numberOfHosts,
             Failover: (if .backupAgentId == 0 then "none" else "\($by[.backupAgentId | tostring].description // .backupAgentId) (down)" end)})

- name: dead_devices_by_collector
  asks: ["is any collector carrying a lot of dead devices?", "which collectors have the most devices down?"]
  covers: "devices down now, counted by collector"
  steps:
    - as: down
      run: DeviceList
      filter: hostStatus:dead
      fields: [id, deviceType, currentCollectorId, collectorDescription]
      size: all
      says: fetched every device that is not responding and counted them by collector
    - as: collectors
      run: CollectorList
      fields: [id, description, isDown, numberOfHosts]
      size: all
      says: fetched every collector's device count
  # hostStatus:dead only: dead-collector devices are down because their
  # collector is, which collectors_down already covers.
  summary: |
    ($collectors | map({key: (.id | tostring), value: .}) | from_entries) as $by
    | ($down | map(select(.deviceType == 0)) | group_by(.currentCollectorId)
       | map({c: $by[.[0].currentCollectorId | tostring], dead: length}) | sort_by(-.dead)) as $per
    | if ($per | length) == 0 then "No devices are failing to respond."
      else "\($per | map(.dead) | add) devices are not responding, on \($per | length | n("collector")). Most: "
      + ($per[:3] | map("\(.c.description // "an unknown collector") (\(.dead) of its \(.c.numberOfHosts // "?"))") | join(", "))
      + ". (Devices down because their collector is down are not counted here.)" end
  table:
    title: Devices not responding, by collector
    columns: [Collector, Not responding, Devices on it, Collector up]
    rows: |
      ($collectors | map({key: (.id | tostring), value: .}) | from_entries) as $by
      | $down | map(select(.deviceType == 0)) | group_by(.currentCollectorId)
      | map($by[.[0].currentCollectorId | tostring] as $c | {Collector: ($c.description // "id \(.[0].currentCollectorId)"),
             "Not responding": length, "Devices on it": $c.numberOfHosts,
             "Collector up": (if $c.isDown then "no" else "yes" end)})
      | sort_by(-."Not responding")

- name: open_alerts
  asks: ["how many alerts are open?", "how many errors are there?", "how many alerts right now?"]
  covers: "open alerts now, across the portal, by severity"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [severity, acked, sdted]
      size: all
      says: fetched every open alert
  summary: |
    "\($alerts | length | n("open alert")): \($alerts | severities). "
    + "\($alerts | map(select(.acked)) | length) acknowledged; \($alerts | map(select(.sdted)) | length) on things in scheduled downtime."
  table:
    title: Open alerts by severity
    columns: [Severity, Open, Acknowledged, In downtime]
    rows: |
      $alerts | group_by(.severity) | reverse | map({Severity: (.[0].severity | sev), Open: length,
        Acknowledged: (map(select(.acked)) | length), "In downtime": (map(select(.sdted)) | length)})

- name: critical_alerts
  asks: ["what critical alerts are open?", "show me the critical alerts"]
  covers: "open critical alerts now, across the portal"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false,severity:4
      fields: [monitorObjectName, resourceTemplateName, instanceName, dataPointName, startEpoch, acked, ackComment, ackedBy]
      size: all
      says: fetched every open critical alert
  summary: |
    if ($alerts | length) == 0 then "No critical alerts are open."
    else "\($alerts | length | n("critical alert")) open, on \($alerts | map(.monitorObjectName) | unique | length) different devices or checks; "
      + "the newest started \($alerts | max_by(.startEpoch).startEpoch | at), the oldest \($alerts | min_by(.startEpoch).startEpoch | at). "
      + "\($alerts | map(select(.acked)) | length) acknowledged." end
  table:
    title: Open critical alerts, newest first
    columns: [Device, Alert, Started, Acknowledged]
    rows: |
      $alerts | sort_by(-.startEpoch) | map({Device: .monitorObjectName,
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")),
        Started: (.startEpoch | at), Acknowledged: ack})

- name: alerts_last_hour
  asks: ["what alerts started in the last hour?", "anything new in the last hour?"]
  covers: "alerts that started in the last hour, open or cleared"
  steps:
    - as: alerts
      run: AlertList
      filter: startEpoch>:now-1h,cleared:*
      fields: [severity, cleared, monitorObjectName, resourceTemplateName, instanceName, dataPointName, startEpoch]
      size: all
      says: fetched the alerts that started in the last hour, open or cleared
  summary: &recent |
    if ($alerts | length) == 0 then "No alerts started in that time."
    else "\($alerts | length | n("alert")) started (\($alerts | severities)); "
      + "\($alerts | map(select(.cleared | not)) | length) still open, \($alerts | map(select(.cleared)) | length) already cleared." end
  table: &recent_table
    title: Alerts that started, newest first
    columns: [Device, Severity, Alert, Started, Still open]
    rows: |
      $alerts | sort_by(-.startEpoch) | map({Device: .monitorObjectName, Severity: (.severity | sev),
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")),
        Started: (.startEpoch | at), "Still open": (if .cleared then "no" else "yes" end)})

- name: alerts_last_day
  asks: ["what alerts started today?", "what alerts started in the last 24 hours?"]
  covers: "alerts that started in the last 24 hours, open or cleared"
  steps:
    - as: alerts
      run: AlertList
      filter: startEpoch>:now-24h,cleared:*
      fields: [severity, cleared, monitorObjectName, resourceTemplateName, instanceName, dataPointName, startEpoch]
      size: all
      says: fetched the alerts that started in the last 24 hours, open or cleared ("today" is taken as the last 24 hours)
  summary: *recent
  table: *recent_table

- name: top_alert_devices
  asks: ["which device has the most open alerts?", "what are the noisiest devices?"]
  covers: "devices with the most open alerts now, across the portal"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectName, severity]
      size: all
      says: fetched every open alert and counted them by device
  summary: |
    ($alerts | group_by(.monitorObjectName) | map({name: .[0].monitorObjectName, count: length, all: .})
     | sort_by(-.count)) as $top
    | if ($top | length) == 0 then "No alerts are open."
      else "\($top[0].name) has the most open alerts: \($top[0].count) (\($top[0].all | severities))."
      + (if ($top | length) > 1 then " Next: " + ($top[1:3] | map("\(.name) (\(.count))") | join(", ")) + "." else "" end) end
  table:
    title: Devices with the most open alerts
    columns: [Device, Open alerts, Critical, Error, Warning]
    rows: |
      $alerts | group_by(.monitorObjectName) | map({Device: .[0].monitorObjectName, "Open alerts": length,
        Critical: (map(select(.severity == 4)) | length), Error: (map(select(.severity == 3)) | length),
        Warning: (map(select(.severity == 2)) | length)}) | sort_by(-."Open alerts") | .[:10]

- name: alerts_unacknowledged
  asks: ["which alerts have been open more than a day with no ack?", "what alerts is nobody looking at?", "what's the oldest open alert?"]
  covers: "open alerts older than a day that nobody has acknowledged and no downtime covers"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false,acked:false,sdted:false,startEpoch<:now-24h
      fields: [severity, monitorObjectName, resourceTemplateName, instanceName, dataPointName, startEpoch]
      size: all
      says: fetched the open alerts older than a day that nobody has acknowledged and no downtime covers
  summary: |
    if ($alerts | length) == 0 then "Every alert open for more than a day has been acknowledged or is in scheduled downtime."
    else "\($alerts | length | n("alert")) have been open for more than a day with no acknowledgement (\($alerts | severities)). "
      + ($alerts | min_by(.startEpoch) | "The oldest, on \(.monitorObjectName), started \(.startEpoch | at).")
      + (($alerts | map(select(.startEpoch < now - 30 * 86400)) | length) as $k | if $k > 0 then " \($k) are over 30 days old." else "" end) end
  table:
    title: Open alerts with no acknowledgement for more than a day, oldest first
    columns: [Device, Severity, Alert, Started]
    rows: |
      $alerts | sort_by(.startEpoch) | map({Device: .monitorObjectName, Severity: (.severity | sev),
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")), Started: (.startEpoch | at)})

- name: alert_types
  asks: ["what are the most common alerts?", "are there common issues across one type of device?", "what kind of problems do we have?", "is one problem hitting lots of devices?"]
  covers: "open alerts now, grouped by what is alerting"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectName, severity, resourceTemplateName, dataPointName]
      size: all
      says: fetched every open alert and grouped them by what is alerting
  # The same alert on many devices points at one cause (an expired password,
  # a changed community string, a bad threshold) rather than many faults.
  summary: |
    ($alerts | group_by(.resourceTemplateName)
     | map({t: .[0].resourceTemplateName, d: (map(.monitorObjectName) | unique | length), all: .}) | sort_by(-.d)) as $types
    | if ($alerts | length) == 0 then "No alerts are open."
      else "\($alerts | length | n("open alert")) of \($types | length) kinds. Most widespread: "
      + ($types[:3] | map("\(.t) on \(.d | n("device")) (\(.all | severities))") | join("; ")) + "." end
  table:
    title: Open alerts by what is alerting, most widespread first
    columns: [Alert, Datapoints, Devices, Alerts, Worst]
    rows: |
      $alerts | group_by(.resourceTemplateName)
      | map({Alert: .[0].resourceTemplateName, Datapoints: (map(.dataPointName) | unique | join(", ")),
             Devices: (map(.monitorObjectName) | unique | length), Alerts: length, Worst: (max_by(.severity).severity | sev)})
      | sort_by(-.Devices, -.Alerts)

- name: certificates_expiring
  asks: ["which SSL certificates are close to expiry?", "are any certificates expiring?"]
  covers: "open alerts on SSL certificates close to expiry"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectName, monitorObjectType, severity, resourceTemplateName, instanceName, dataPointName, startEpoch, alertValue]
      size: all
      says: fetched every open alert and kept the certificate ones (SSL certificate checks and website certificate expiry)
  # From alerts, so "close" means past the warning threshold the portal sets;
  # a certificate no check covers cannot show up here.
  summary: |
    ($alerts | map(select((.resourceTemplateName + " " + .dataPointName) | test("(?i)ssl|certif|days ?(remaining|until ?expir)")))) as $c
    | if ($c | length) == 0 then "No certificate alerts are open: no monitored certificate is past its expiry warning."
      else "\($c | length | n("certificate alert")) open (\($c | severities)), on \($c | map(.monitorObjectName) | unique | length) devices or websites"
        + (($c | map(select((.alertValue | tonumber? // 1) < 0)) | length) as $x | if $x > 0 then "; \($x) of the certificates have already expired" else "" end)
        + "." end
    + " This covers only certificates that a check watches and that have passed its warning threshold."
  table:
    title: Certificates past their expiry warning
    columns: [Where, Severity, Alert, Days left, Since]
    rows: |
      $alerts | map(select((.resourceTemplateName + " " + .dataPointName) | test("(?i)ssl|certif|days ?(remaining|until ?expir)")))
      | sort_by(.alertValue | tonumber? // 0) | map({Where: .monitorObjectName, Severity: (.severity | sev),
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")),
        "Days left": (.alertValue | tonumber? // . | if type == "number" then floor else . end), Since: (.startEpoch | at)})

- name: disks_filling
  asks: ["what disks are about to fill up?", "which filesystems are nearly full?", "is anything running out of disk space?"]
  covers: "open alerts on disks past their space threshold"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectName, severity, resourceTemplateName, instanceName, dataPointName, startEpoch, alertValue]
      size: all
      says: fetched every open alert and kept the disk space ones (used or free percent on a disk, volume or filesystem)
  # hrStorage covers memory as well as disks: its memory instances are left out
  # by name. From alerts, so "about to fill" means past the portal's threshold.
  summary: |
    ($alerts | map(select((.dataPointName | test("(?i)used ?percent|percent ?used|free ?percent|percent ?free|capacity"))
       and ((.instanceName // "") | test("(?i)memory|swap|ram\\b|buffer|cache") | not)))) as $d
    | if ($d | length) == 0 then "No disk space alerts are open: no monitored disk is past its threshold."
      else "\($d | length | n("disk space alert")) open (\($d | severities)), on \($d | map(.monitorObjectName) | unique | length | n("device"))."
        + ($d | max_by(.alertValue | tonumber? // 0) | " The fullest: \(.instanceName) on \(.monitorObjectName) at \(.alertValue).") end
    + " This covers only disks past the alert threshold; it is not a forecast."
  table:
    title: Disks past their space threshold, fullest first
    columns: [Device, Disk, Severity, Value, Since]
    rows: |
      $alerts | map(select((.dataPointName | test("(?i)used ?percent|percent ?used|free ?percent|percent ?free|capacity"))
         and ((.instanceName // "") | test("(?i)memory|swap|ram\\b|buffer|cache") | not)))
      | sort_by(-(.alertValue | tonumber? // 0))
      | map({Device: .monitorObjectName, Disk: (.instanceName // .resourceTemplateName), Severity: (.severity | sev),
             Value: .alertValue, Since: (.startEpoch | at)})

- name: clocks_out_of_sync
  asks: ["are any clocks out of sync?", "any NTP or time problems?"]
  covers: "open alerts on clocks out of sync"
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectName, severity, resourceTemplateName, instanceName, dataPointName, startEpoch, alertValue]
      size: all
      says: fetched every open alert and kept the time ones (NTP, clock offset)
  summary: |
    ($alerts | map(select((.resourceTemplateName | test("(?i)ntp|clock|time ?(stats|sync|offset)")) or (.dataPointName | test("(?i)offset|skew|stratum"))))) as $t
    | if ($t | length) == 0 then "No time or NTP alerts are open."
      else "\($t | length | n("time alert")) open (\($t | severities)), on \($t | map(.monitorObjectName) | unique | length | n("device"))." end
  table:
    title: Time and NTP alerts
    columns: [Device, Severity, Alert, Value, Since]
    rows: |
      $alerts | map(select((.resourceTemplateName | test("(?i)ntp|clock|time ?(stats|sync|offset)")) or (.dataPointName | test("(?i)offset|skew|stratum"))))
      | sort_by(-.severity, .monitorObjectName) | map({Device: .monitorObjectName, Severity: (.severity | sev),
        Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")), Value: .alertValue, Since: (.startEpoch | at)})

- name: new_alerts
  asks: ["is anything worse than yesterday?", "what's new since yesterday?", "what started alerting today?"]
  covers: "alerts that started in the last 24 hours (no comparison with earlier days)"
  steps:
    - as: alerts
      run: AlertList
      filter: startEpoch>:now-24h,cleared:*
      fields: [monitorObjectName, resourceTemplateName, dataPointName, severity, cleared, startEpoch]
      size: all
      says: fetched every alert that started in the last 24 hours, open or cleared
  # Samara keeps no history, so "worse than yesterday" cannot compare totals;
  # what started in the last day is the honest answer, and the summary says so.
  summary: |
    ($alerts | map(select(.cleared | not))) as $open
    | "Samara keeps no history, so it cannot compare today's totals with yesterday's. What it can show: "
    + if ($alerts | length) == 0 then "no alerts started in the last 24 hours."
      else "\($alerts | length | n("alert")) started in the last 24 hours, \($open | length) still open"
      + (if ($open | length) > 0 then " (\($open | severities))" else "" end)
      + ", on \($alerts | map(.monitorObjectName) | unique | length) different devices or checks." end
  table:
    title: Alerts that started in the last 24 hours, newest first
    columns: [Device, Alert, Severity, Started, Open]
    rows: |
      $alerts | sort_by(-.startEpoch)
      | map({Device: .monitorObjectName, Alert: "\(.resourceTemplateName) / \(.dataPointName)", Severity: (.severity | sev),
             Started: (.startEpoch | at), Open: (if .cleared then "cleared" else "open" end)})

- name: noisiest_week
  asks: ["what's the noisiest alert or device this week?", "what alerted most in the last 7 days?", "what should we tune?"]
  covers: "alerts that started in the last 7 days, counted by device and kind"
  steps:
    - as: alerts
      run: AlertList
      filter: startEpoch>:now-7d,cleared:*
      fields: [monitorObjectName, resourceTemplateName, dataPointName, severity]
      size: all
      says: fetched every alert that started in the last 7 days, open or cleared, and counted them
  # Alerts that fire and clear over and over are what tuning fixes, so count
  # starts, not what is open now.
  summary: |
    ($alerts | group_by([.monitorObjectName, .resourceTemplateName, .dataPointName])
     | map({d: .[0].monitorObjectName, a: "\(.[0].resourceTemplateName) / \(.[0].dataPointName)", n: length}) | sort_by(-.n)) as $top
    | ($alerts | group_by(.monitorObjectName) | map({d: .[0].monitorObjectName, n: length}) | sort_by(-.n)) as $dev
    | if ($alerts | length) == 0 then "No alerts started in the last 7 days."
      else "\($alerts | length | n("alert")) started in the last 7 days. Noisiest: \($top[0].a) on \($top[0].d), \($top[0].n) times. "
      + "The noisiest devices: " + ($dev[:3] | map("\(.d) (\(.n))") | join(", ")) + "." end
  table:
    title: Alerts that fired most in the last 7 days
    columns: [Device, Alert, Times, Worst]
    rows: |
      $alerts | group_by([.monitorObjectName, .resourceTemplateName, .dataPointName])
      | map({Device: .[0].monitorObjectName, Alert: "\(.[0].resourceTemplateName) / \(.[0].dataPointName)",
             Times: length, Worst: (max_by(.severity).severity | sev)}) | sort_by(-.Times) | .[:20]

- name: long_downtime
  asks: ["which downtimes have no end date or last more than a week?", "is anything in downtime too long?"]
  covers: "downtimes with no end or longer than a week"
  steps:
    - as: sdts
      run: SDTList
      size: all
      says: fetched every scheduled downtime and kept the one-off ones lasting more than 7 days
  # Repeating SDTs (daily, weekly) are short windows by design; a one-off SDT
  # running for weeks usually means something was forgotten. Who set it is
  # left out: it is a person's email address.
  summary: |
    ($sdts | map(select(.sdtType == "oneTime" and (.endDateTime - .startDateTime) > 7 * 86400000))) as $long
    | if ($long | length) == 0 then "No one-off downtime lasts more than 7 days."
      else "\($long | length | n("one-off downtime")) \(if ($long | length) == 1 then "lasts" else "last" end) more than 7 days; "
      + "\($long | map(select(.isEffective)) | length) in effect now. The longest runs until \($long | max_by(.endDateTime) | .endDateTime / 1000 | at)." end
  table:
    title: One-off downtime lasting more than 7 days
    columns: [For, Starts, Ends, Days, In effect now]
    rows: |
      $sdts | map(select(.sdtType == "oneTime" and (.endDateTime - .startDateTime) > 7 * 86400000))
      | sort_by(-.endDateTime) | map({
        For: (.deviceDisplayName // .deviceGroupFullPath // .websiteName // .websiteGroupName // .collectorDescription // .type),
        Starts: (.startDateTime / 1000 | when), Ends: (.endDateTime / 1000 | at),
        Days: ((.endDateTime - .startDateTime) / 86400000 | floor), "In effect now": (if .isEffective then "yes" else "no" end)})

- name: alerting_disabled
  asks: ["what devices have alerting disabled?", "which devices won't alert?"]
  covers: "devices with alerting turned off, by themselves or a group"
  steps:
    - as: devices
      run: DeviceList
      fields: [id, displayName, deviceType, alertDisableStatus]
      size: all
      says: fetched every device's alerting setting, including what its groups set
  summary: |
    ($devices | map(select(.alertDisableStatus | test("disable")))) as $off
    | ($off | map(select(.deviceType == 0))) as $real
    | ($devices | map(select(.deviceType == 0)) | length) as $all
    | def by($w): $real | map(select(.alertDisableStatus | disabled_by | index($w))) | length;
    "\($real | length) of \($all) devices have alerting disabled: \(by("a group")) by a group they are in, "
    + "\(by("its own setting")) by their own setting, \(by("some instances")) on some instances (a device can have more than one)."
    + (if ($off | length) > ($real | length) then " Another \(($off | length) - ($real | length)) objects that are not devices also have it disabled." else "" end)
  table:
    title: Devices with alerting disabled
    columns: [Device, Disabled by]
    rows: |
      $devices | map(select(.deviceType == 0 and (.alertDisableStatus | test("disable")))) | sort_by(.displayName)
      | map({Device: .displayName, "Disabled by": (.alertDisableStatus | disabled_by | join(", "))})

- name: downtime
  asks: ["what's in scheduled downtime now?", "what downtime is scheduled this week?", "what's in maintenance?",
         "is any work planned this weekend?", "is there a maintenance window coming up?"]
  covers: "scheduled downtime across the portal, now and coming"
  steps:
    - as: sdts
      run: SDTList
      size: all
      says: fetched every scheduled downtime
  summary: |
    (now * 1000) as $ms | ($ms + 7 * 86400000) as $week
    | ($sdts | map(select(.isEffective)) | length) as $on
    | ($sdts | map(select((.isEffective | not) and .startDateTime > $ms and .startDateTime < $week)) | length) as $soon
    | "\($on) in effect now; \($soon) more \(if $soon == 1 then "starts" else "start" end) in the next 7 days; \($sdts | length) scheduled in all."
  table:
    title: Downtime in effect now or starting in the next 7 days
    columns: [For, Starts, Ends, Repeats, In effect now]
    rows: |
      (now * 1000) as $ms
      | $sdts | map(select(.isEffective or (.startDateTime > $ms and .startDateTime < $ms + 7 * 86400000)))
      | sort_by(.startDateTime) | map({
        For: (.deviceDisplayName // .deviceGroupFullPath // .websiteName // .websiteGroupName
              // .collectorDescription // .type),
        Starts: (.startDateTime / 1000 | at), Ends: (.endDateTime / 1000 | when),
        Repeats: ({"oneTime": "no", "daily": "daily", "weekly": "weekly", "monthly": "monthly",
                   "monthlyByWeek": "monthly"}[.sdtType] // .sdtType),
        "In effect now": (if .isEffective then "yes" else "no" end)})

- name: websites_failing
  asks: ["which website checks are failing?", "are any websites down?"]
  covers: "website checks with open alerts now"
  steps:
    - as: sites
      run: WebsiteList
      fields: [id, name, type]
      size: all
      says: fetched every website check
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectType, monitorObjectName, severity, startEpoch]
      size: all
      says: fetched every open alert and kept the ones on website checks
  summary: |
    ($alerts | map(select(.monitorObjectType == "website"))) as $web
    | "\($web | map(.monitorObjectName) | unique | length) of \($sites | length) website checks have open alerts"
    + (if ($web | length) > 0 then " (\($web | length | n("alert")): \($web | severities))" else "" end) + "."
  table:
    title: Website checks with open alerts
    columns: [Website, Open alerts, Worst, Since]
    rows: |
      $alerts | map(select(.monitorObjectType == "website")) | group_by(.monitorObjectName)
      | map({Website: .[0].monitorObjectName, "Open alerts": length, Worst: (max_by(.severity).severity | sev),
             Since: (min_by(.startEpoch).startEpoch | at), s: (max_by(.severity).severity)})
      | sort_by(-.s, .Website)

- name: device_counts
  asks: ["how many devices do we monitor?", "how many devices are there?"]
  covers: "how many objects are monitored, by kind and how many are down"
  steps:
    - as: devices
      run: DeviceList
      fields: [deviceType, hostStatus]
      size: all
      says: fetched every monitored object's type and status
  summary: |
    ($devices | map(select(.deviceType == 0))) as $real
    | "\($devices | length | n("monitored object")): \($real | length) devices"
    + " (\($real | map(select(.hostStatus != "normal")) | length) of them down), and "
    + ($devices | map(select(.deviceType != 0) | .kind = (.deviceType | kind)) | group_by(.kind)
       | map("\(.[0].kind): \(length)") | join(", ")) + "."
  table:
    title: Monitored objects by kind
    columns: [Kind, Count, Down]
    rows: |
      $devices | map(.kind = (.deviceType | kind)) | group_by(.kind) | map({Kind: .[0].kind, Count: length,
        Down: (map(select(.hostStatus != "normal")) | length)}) | sort_by(-.Count)

# --- One group ----------------------------------------------------------------

- name: group_health
  asks: ["how is GROUP doing?", "which devices in GROUP are down?", "any problems in GROUP?"]
  covers: "one group now: its devices, how many are down, its open alerts"
  params: [group]
  steps:
    - as: subgroups
      run: DeviceGroupList
      filter: fullPath~"{group[fullPath]}/"
      fields: [id, fullPath]
      size: all
      says: found its subgroups
    - as: down
      run: DeviceList
      filter: hostStatus~dead
      fields: [id, displayName, hostStatus, hostGroupIds, deviceType]
      size: all
      says: fetched the devices that are down and kept the ones in this group or below it
    - as: alerts
      run: AlertListByDeviceGroupId
      params: {id: "{group[id]}"}
      filter: cleared:false
      fields: [monitorObjectName, severity]
      size: all
      says: fetched the open alerts in the group, subgroups included
  summary: |
    $group[0] as $g
    | ([$g.id] + ($subgroups | map(select(.fullPath | startswith($g.fullPath + "/")) | .id))) as $ids
    | ($down | map(select(.deviceType == 0 and (.hostGroupIds | split(",") | map(tonumber) | any(. as $i | $ids | index($i)))))) as $in
    | "\($g.fullPath) has \($g.numOfHosts | n("device")) (subgroups included). "
    + "\($in | length) down (\($in | map(select(.hostStatus == "dead")) | length) not responding, "
    + "\($in | map(select(.hostStatus == "dead-collector")) | length) with their collector down). "
    + (if ($alerts | length) == 0 then "No open alerts."
       else "\($alerts | length | n("open alert")) (\($alerts | severities)) on \($alerts | map(.monitorObjectName) | unique | length | n("device"))." end)
  table:
    title: Devices down in {group[fullPath]}
    columns: [Device, Status]
    rows: |
      $group[0] as $g
      | ([$g.id] + ($subgroups | map(select(.fullPath | startswith($g.fullPath + "/")) | .id))) as $ids
      | $down | map(select(.deviceType == 0 and (.hostGroupIds | split(",") | map(tonumber) | any(. as $i | $ids | index($i)))))
      | sort_by(.hostStatus, .displayName) | map({Device: .displayName, Status: (.hostStatus | state)})

- name: group_dashboards_reports
  asks: ["what dashboards does GROUP have?", "what reports does GROUP get?", "what dashboards or reports does GROUP have?"]
  covers: "the dashboards and reports for one group or customer, matched by name, folder or tenant"
  params: [group]
  # Dashboards and reports are not in device groups, so they are matched by the
  # group's name: in their own name, their folder, or the tenant field. The
  # tenant was empty on every dashboard and report on the sandbox, a new one
  # included (2026-10-31); the folder found all 14 acme dashboards.
  steps:
    - as: dashboards
      run: DashboardList
      fields: [id, name, groupFullPath, tenantIdentifier]
      size: all
      says: fetched every dashboard and kept the ones with the group's name in their name, folder or tenant
    - as: folders
      run: ReportGroupList
      fields: [id, name]
      size: all
      says: fetched the report folders
    - as: reports
      run: ReportList
      fields: [id, name, groupId, type, delivery, lastGenerateOn, recipients, tenantIdentifier]
      size: all
      says: fetched every report and kept the ones with the group's name in their name, folder or tenant
  summary: |
    ($group[0].name | ascii_downcase) as $k
    | def has: (. // "") | ascii_downcase | contains($k);
    ($folders | map(select(.name | has)) | map(.id)) as $f
    | ($dashboards | map(select((.name | has) or (.groupFullPath | has) or ((.tenantIdentifier // "") | ascii_downcase) == $k))) as $d
    | ($reports | map(select((.name | has) or (.groupId as $g | $f | index($g)) or ((.tenantIdentifier // "") | ascii_downcase) == $k))) as $r
    | "\($d | length | n("dashboard")) and \($r | length | n("report")) have \($group[0].name) in their name, folder or tenant"
    + (if ($r | length) > 0 then "; \($r | map(select(.delivery == "email")) | length) of the reports are emailed." else "." end)
  table:
    title: Dashboards and reports for {group[name]}
    columns: [Kind, Name, Folder, Sent to, Last run]
    rows: |
      ($group[0].name | ascii_downcase) as $k
      | def has: (. // "") | ascii_downcase | contains($k);
      ($folders | map({key: (.id | tostring), value: .name}) | from_entries) as $names
      | ($folders | map(select(.name | has)) | map(.id)) as $f
      | ($dashboards | map(select((.name | has) or (.groupFullPath | has) or ((.tenantIdentifier // "") | ascii_downcase) == $k))
         | sort_by(.groupFullPath, .name) | map({Kind: "dashboard", Name: .name, Folder: .groupFullPath, "Sent to": "", "Last run": ""}))
      + ($reports | map(select((.name | has) or (.groupId as $g | $f | index($g)) or ((.tenantIdentifier // "") | ascii_downcase) == $k))
         | sort_by(.name) | map({Kind: "report", Name: .name, Folder: ($names[.groupId | tostring] // ""),
             "Sent to": (if .delivery == "email" then (.recipients // [] | map(.addr) | join(", ")) else "nobody" end),
             "Last run": (if (.lastGenerateOn // 0) > 0 then .lastGenerateOn | at else "never" end)}))

# --- One person -----------------------------------------------------------------

- name: acknowledged_by
  asks: ["what's PERSON working on?", "what has PERSON acknowledged?", "is PERSON looking at anything?"]
  covers: "open alerts acknowledged by one person, or with their name in the acknowledgement note"
  params: [person]
  # LM knows what someone is working on only from the alerts they acknowledged.
  # The note and the login are matched here, in jq on the real rows; the model
  # gets the counts only, as both are withheld from it (elm_tools FREE_TEXT_FIELDS).
  steps:
    - as: alerts
      run: AlertList
      filter: cleared:false,acked:true
      fields: [monitorObjectName, severity, resourceTemplateName, instanceName, dataPointName, acked, ackComment, ackedBy, ackedEpoch]
      size: all
      says: fetched the open alerts that are acknowledged, and kept the ones with the name in the note or the login
  summary: |
    ($person[0].name | ascii_downcase) as $k
    | ($alerts | map(select(.acked))) as $acked
    | ($acked | map(select(((.ackComment // "") + " " + (.ackedBy // "")) | ascii_downcase | contains($k)))) as $m
    | if ($m | length) == 0
      then "No open alert is acknowledged by \($person[0].name), or names them in its note (\($acked | length | n("open alert")) acknowledged in all)."
      else "\($m | length | n("open alert")) on \($m | map(.monitorObjectName) | unique | length | n("device")) "
        + "\(if ($m | length) == 1 then "is" else "are" end) acknowledged by \($person[0].name) or name them in the note (\($m | severities))." end
  table:
    title: Open alerts for {person[name]}
    columns: [Device, Severity, Alert, Acknowledged, When]
    rows: |
      ($person[0].name | ascii_downcase) as $k
      | $alerts | map(select(.acked and ((((.ackComment // "") + " " + (.ackedBy // "")) | ascii_downcase | contains($k)))))
      | sort_by(-.severity, -.ackedEpoch) | map({Device: .monitorObjectName, Severity: (.severity | sev),
          Alert: ([.resourceTemplateName, .instanceName, .dataPointName] | map(select(. != null and . != "")) | join(" / ")),
          Acknowledged: ack, When: (.ackedEpoch | at)})

# --- One collector -------------------------------------------------------------

- name: collector_health
  asks: ["is COLLECTOR healthy?", "is the COLLECTOR host itself okay?", "are there common issues on COLLECTOR?", "which devices on COLLECTOR are down?"]
  covers: "one collector now: up or down, its devices and their alerts"
  params: [collector]
  steps:
    - as: host_alerts
      run: AlertListByDeviceId
      params: {id: "{collector[collectorDeviceId]}"}
      filter: cleared:false
      fields: [severity, resourceTemplateName, instanceName, dataPointName, startEpoch]
      when: $collector[0].collectorDeviceId > 0
      says: fetched the open alerts on the collector's own host
    - as: devices
      run: DeviceList
      filter: currentCollectorId:{collector[id]}
      fields: [id, displayName, hostStatus, deviceType]
      size: all
      says: fetched the devices it monitors
    - as: alerts
      run: AlertList
      filter: cleared:false
      fields: [monitorObjectId, monitorObjectName, severity, resourceTemplateName, dataPointName]
      size: all
      says: fetched every open alert and kept the ones on its devices, grouped by what is alerting
  summary: |
    $collector[0] as $c
    | ($devices | map(.id)) as $ids
    | ($alerts | map(select(.monitorObjectId as $i | $ids | index($i)))) as $mine
    | ($devices | map(select(.deviceType == 0 and .hostStatus == "dead"))) as $dead
    | ($mine | group_by(.resourceTemplateName) | map({t: .[0].resourceTemplateName, d: (map(.monitorObjectId) | unique | length), a: length})
       | sort_by(-.d, -.a)) as $types
    | "Collector \($c.description) (group \($c.collectorGroupName), version \($c.build | ver)) is "
    + (if $c.isDown then "DOWN, last heard from \($c.watchdogUpdatedOn | at)" else "up" end)
    + (if $c.backupAgentId > 0 then ", failing over to collector \($c.backupAgentId)" else ", with no failover collector" end) + ". "
    + (if $c.collectorDeviceId == 0 then "Its own host is not monitored as a device, so its CPU and memory cannot be checked. "
       elif ($host_alerts | length) == 0 then "Its own host has no open alerts. "
       else "Its own host has \($host_alerts | length | n("open alert")) (\($host_alerts | severities)). " end)
    + "It monitors \($devices | length | n("device")), \($dead | length) not responding"
    + (if ($mine | length) == 0 then "; none has open alerts."
       else "; \($mine | length | n("open alert")) on them (\($mine | severities)). Most widespread: "
       + ($types[:3] | map("\(.t) (\(.d | n("device")))") | join(", ")) + "." end)
  table:
    title: Open alerts on devices monitored by {collector[description]}, by what is alerting
    columns: [Alert, Devices, Alerts, Worst]
    rows: |
      ($devices | map(.id)) as $ids
      | $alerts | map(select(.monitorObjectId as $i | $ids | index($i))) | group_by(.resourceTemplateName)
      | map({Alert: .[0].resourceTemplateName, Devices: (map(.monitorObjectId) | unique | length), Alerts: length,
             Worst: (max_by(.severity).severity | sev)})
      | sort_by(-.Devices, -.Alerts)

# --- Things it cannot do ----------------------------------------------------

- name: read_only
  asks: ["acknowledge an alert", "put DEVICE in downtime", "change or delete anything"]
  summary: |
    "Samara is read-only: it cannot acknowledge alerts, schedule downtime or change anything in LogicMonitor. Do that in the LogicMonitor portal."
