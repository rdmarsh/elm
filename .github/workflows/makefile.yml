name: Makefile CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # The tests run the binary with no --config, and --list must show
    # '* config', so a default profile has to exist. The example file's dummy
    # credentials, never real ones: nothing below sends a request.
    - name: Create a dummy default profile from the example file
      run: |
        mkdir -p ~/.config/logicmonitor/credentials
        cp config.example.ini ~/.config/logicmonitor/credentials/config.ini
        chmod 700 ~/.config/logicmonitor/credentials
        chmod 600 ~/.config/logicmonitor/credentials/*.ini

    - name: Build (render the templates, PyInstaller binary)
      run: make

    - name: Every test that needs no credentials
      run: make testoffline
