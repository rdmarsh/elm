access_id = '12345678901234567890'
access_key = '1234567890123456789123456789012345678901'
account_name = 'example'

# limit this profile to some commands (shell-style wildcards); anything else is
# refused with exit code 3 before any request is sent, and --help/--info only
# show these. No line = every command; [] = none; must fit on one line.
# See README "Restricting a profile to some commands", and ai.example.ini for a
# suggested profile for AI assistants.
#allowed_commands = ['MetricsUsage']
#allowed_commands = ['DeviceList', 'Device*', 'AlertList']

